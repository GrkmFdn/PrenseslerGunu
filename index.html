<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>18 Kasım • Prensesler Günün Kutlu Olsun En Güzelim</title>
  <meta name="description" content="18 Kasım Dünya Prensesler Günü için özel kasımpatı sürprizi." />

  <!-- Google Fonts (Türkçe karakter destekli zarif serif ve el yazısı) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Great+Vibes&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Paylaşılan SVG Renk Geçişleri -->
  <svg width="0" height="0" class="svg-defs" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="gold-foil-grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#F7E7B4" />
        <stop offset="50%" stop-color="#D4AF37" />
        <stop offset="100%" stop-color="#9E7418" />
      </linearGradient>
      <radialGradient id="wax-disc-grad" cx="38%" cy="32%" r="68%">
        <stop offset="0%" stop-color="#E87A9A" />
        <stop offset="55%" stop-color="#B54067" />
        <stop offset="100%" stop-color="#762140" />
      </radialGradient>
      <linearGradient id="stem-grad" x1="0%" y1="100%" x2="0%" y2="0%">
        <stop offset="0%" stop-color="#4A644E" />
        <stop offset="55%" stop-color="#5E8064" />
        <stop offset="100%" stop-color="#749B7B" />
      </linearGradient>
      <linearGradient id="root-grad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#6B5344" />
        <stop offset="100%" stop-color="#A1836D" />
      </linearGradient>
      <linearGradient id="leaf-grad" x1="0%" y1="100%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#47664C" />
        <stop offset="100%" stop-color="#759A7B" />
      </linearGradient>
      <radialGradient id="flower-aura-grad" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#E88D8A" stop-opacity="0.28" />
        <stop offset="60%" stop-color="#F3E5AB" stop-opacity="0.12" />
        <stop offset="100%" stop-color="#FFF9F6" stop-opacity="0" />
      </radialGradient>
    </defs>
  </svg>

  <main class="experience-viewport">
    <!-- AŞAMA 1: SADE KRALİYET ZARFI & MÜHÜR -->
    <section id="seal-stage" class="seal-stage" aria-label="Mühürlü Zarf">
      <div class="envelope-container">
        <p class="seal-eyebrow" data-config="dateBadge">18 KASIM • DÜNYA PRENSESLER GÜNÜ</p>

        <div id="envelope-wrapper" class="envelope-wrapper">
          <div class="envelope-back" aria-hidden="true"></div>

          <div class="envelope-pocket" aria-hidden="true">
            <div class="envelope-flap-left"></div>
            <div class="envelope-flap-right"></div>
            <div class="envelope-flap-bottom"></div>
            <p class="envelope-to-label" data-config="envelopeTo">En Güzelim İçin</p>
          </div>

          <div class="envelope-top-flap" aria-hidden="true">
            <div class="envelope-top-flap-inner"></div>
          </div>

          <button
            type="button"
            id="wax-seal-btn"
            class="wax-seal-btn"
            aria-label="Mührü kırmak için dokun"
          >
            <span class="seal-aura" aria-hidden="true"></span>
            <span class="seal-disc" aria-hidden="true">
              <svg viewBox="0 0 100 100" class="seal-svg">
                <circle cx="50" cy="50" r="46" fill="url(#wax-disc-grad)" stroke="#F3E5AB" stroke-width="2" stroke-opacity="0.7" />
                <circle cx="50" cy="50" r="38" fill="none" stroke="#F7E7B4" stroke-width="1.2" stroke-dasharray="3 3" stroke-opacity="0.65" />
                <path
                  d="M29 61 L33 41 L43 50 L50 34 L57 50 L67 41 L71 61 Z M30 64 H70 V68 H30 Z"
                  fill="url(#gold-foil-grad)"
                />
                <circle cx="33" cy="38.5" r="2.5" fill="#FFF7DF" />
                <circle cx="50" cy="31.5" r="3" fill="#FFF7DF" />
                <circle cx="67" cy="38.5" r="2.5" fill="#FFF7DF" />
              </svg>
            </span>
          </button>
        </div>

        <p id="seal-hint" class="seal-hint">Mührü Kırmak İçin Dokun</p>
      </div>
    </section>

    <!-- AŞAMA 2: KÖKTEN BÜYÜYEN KASIMPATI & KUTLAMA MESAJI -->
    <section id="bloom-stage" class="bloom-stage is-hidden" aria-hidden="true">
      <div class="plant-stage">
        <svg
          id="chrysanthemum-plant"
          class="chrysanthemum-plant"
          viewBox="0 0 360 480"
          role="img"
          aria-label="Kökten başlayarak büyüyen kasımpatı çiçeği"
        >
          <!-- Çiçek Arkası Yumuşak Işık Halesi -->
          <circle class="flower-aura" cx="180" cy="154" r="132" fill="url(#flower-aura-grad)" />

          <!-- Toprak / Kök Çizgisi -->
          <ellipse class="soil-shadow" cx="180" cy="414" rx="68" ry="8" fill="#8C6E63" fill-opacity="0.2" />

          <!-- Kökler (Adım 1: Kökten Başlayarak Çizilir) -->
          <g class="roots-group" fill="none" stroke="url(#root-grad)" stroke-linecap="round">
            <path class="root-path root-1" stroke-width="3.6" d="M180 412 Q176 436 182 464" />
            <path class="root-path root-2" stroke-width="2.7" d="M180 414 Q157 429 135 451" />
            <path class="root-path root-3" stroke-width="2.1" d="M161 428 Q152 444 146 458" />
            <path class="root-path root-4" stroke-width="2.7" d="M180 414 Q204 429 225 451" />
            <path class="root-path root-5" stroke-width="2.1" d="M199 428 Q208 443 214 458" />
          </g>

          <!-- Ana Gövde / Sap (Adım 2: Kökten Yukarıya Uzar) -->
          <path
            id="stem-path"
            class="stem-path"
            d="M180 414 C172 342 190 250 180 162"
            fill="none"
            stroke="url(#stem-grad)"
            stroke-width="6.5"
            stroke-linecap="round"
          />

          <!-- Kasımpatı Gövde Yaprakları (Adım 3: Düğüm Noktalarından Filizlenir) -->
          <g class="stem-leaves">
            <!-- Sol Alt Yaprak -->
            <g class="leaf-node leaf-left-1" transform="translate(177 338)">
              <g class="leaf-inner">
                <path
                  d="M0,0 C-14,-4 -26,-16 -42,-16 C-38,-22 -46,-30 -58,-28 C-56,-36 -66,-44 -78,-40 C-74,-26 -62,-18 -56,-14 C-66,-10 -70,0 -58,6 C-44,6 -32,0 -22,4 C-14,7 -6,4 0,0 Z"
                  fill="url(#leaf-grad)"
                />
                <path d="M-2,-1 Q-34,-18 -68,-34" fill="none" stroke="#9DC0A2" stroke-width="1.2" stroke-opacity="0.65" />
              </g>
            </g>

            <!-- Sağ Orta Yaprak -->
            <g class="leaf-node leaf-right-1" transform="translate(183 288)">
              <g class="leaf-inner">
                <path
                  d="M0,0 C14,-5 26,-17 42,-17 C38,-23 46,-31 58,-29 C56,-37 66,-45 78,-41 C74,-27 62,-19 56,-15 C66,-11 70,-1 58,5 C44,5 32,-1 22,3 C14,6 6,4 0,0 Z"
                  fill="url(#leaf-grad)"
                />
                <path d="M2,-1 Q34,-18 68,-35" fill="none" stroke="#9DC0A2" stroke-width="1.2" stroke-opacity="0.65" />
              </g>
            </g>

            <!-- Sol Üst Küçük Yaprak -->
            <g class="leaf-node leaf-left-2" transform="translate(182 232) scale(0.76)">
              <g class="leaf-inner">
                <path
                  d="M0,0 C-14,-4 -26,-16 -42,-16 C-38,-22 -46,-30 -58,-28 C-56,-36 -66,-44 -78,-40 C-74,-26 -62,-18 -56,-14 C-66,-10 -70,0 -58,6 C-44,6 -32,0 -22,4 C-14,7 -6,4 0,0 Z"
                  fill="url(#leaf-grad)"
                />
                <path d="M-2,-1 Q-34,-18 -68,-34" fill="none" stroke="#9DC0A2" stroke-width="1.2" stroke-opacity="0.65" />
              </g>
            </g>
          </g>

          <!-- Kasımpatı Çiçek Başı (Adım 4: Katman Katman Açar) -->
          <g class="flower-head-anchor" transform="translate(180 154)">
            <g class="flower-head-sway">
              <!-- Çanak Yapraklar -->
              <g class="flower-calyx">
                <path d="M-12,8 Q-24,22 -36,16 Q-22,4 -10,2 Z" fill="#5B7E61" />
                <path d="M12,8 Q24,22 36,16 Q22,4 10,2 Z" fill="#5B7E61" />
                <path d="M-6,10 Q0,26 6,10 Z" fill="#4B6B51" />
              </g>

              <!-- 4 Katmanlı Taç Yapraklar & Merkez (script.js tarafından doldurulur) -->
              <g id="flower-petals-group"></g>
            </g>
          </g>
        </svg>
      </div>

      <!-- AŞAMA 3: ÇİÇEK AÇTIKTAN SONRA BELİREN MESAJ -->
      <div class="bloom-message-box">
        <p class="bloom-date" data-config="dateBadge">18 KASIM • DÜNYA PRENSESLER GÜNÜ</p>
        <h1 class="bloom-message" data-config="message">
          Prensesler Günün Kutlu Olsun En Güzelim
        </h1>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
